[project]
name = "score-backend"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "Pineapple-Soup", email = "91655764+Pineapple-Soup@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "google-auth>=2.58.1",
    "google-cloud-storage>=3.15.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
    "types-python-jose>=3.5.0.20260408",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
]
