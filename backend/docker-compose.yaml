services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - ".env"
    volumes:
      - "${GOOGLE_CREDENTIALS_FILE}:/app/google-application-credentials.json:ro"
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-score_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-score}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
